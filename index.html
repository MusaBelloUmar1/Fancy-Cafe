<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Flour Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,600,700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div id="intro-overlay">
        <div id="intro-hello" class="intro-text">Hello!</div>
        <div id="intro-welcome" class="intro-text">Welcome</div>
        <div id="intro-2" class="intro-text">2</div>
    </div>

    <main id="main-content" class="hidden">
        <div class="container">
            <div class="logo-circle">
                <!-- Logo placeholder -->
                <div class="logo-placeholder">FFC</div>
            </div>

            <div class="badge">welcome to</div>

            <h1 class="cafe-title">Fancy Flour Cafe</h1>

            <a href="https://www.qrshop.name.ng/fancycafe" class="continue-btn">
                <span>Continue</span>
                <div class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
